<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — text.md</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <style>
        :root {
            --bg: #0d1310;
            --bg-elev: #161e1a;
            --bg-code: #131915;
            --text: #e8e6e0;
            --text-mute: #8a948e;
            --text-faint: #5a6660;
            --accent: #c9a961;
            --accent-dim: #8a7544;
            --line: #232c27;
            --line-soft: #1a201d;
            --ease-quiet: cubic-bezier(.22, 1, .36, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 400;
            line-height: 1.75;
            font-size: 17px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(201,169,97,0.045), transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(45,62,52,0.18), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        /* ─────────── Top Menubar ─────────── */
        #md-tabs {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            background: rgba(13,19,16,0.95);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            scrollbar-width: none;
        }
        #md-tabs::-webkit-scrollbar { display: none; }
        .md-tab {
            padding: 0.75rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-mute);
            text-decoration: none;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: color 300ms ease, border-color 300ms ease;
            cursor: pointer;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .md-tab:hover { color: var(--text); }
        .md-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .md-tab-home {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-mute);
            text-decoration: none;
            padding: 0.75rem 0.5rem;
            border-bottom: 2px solid transparent;
            transition: color 300ms ease, border-color 300ms ease;
            white-space: nowrap;
            margin-left: auto;
        }
        .md-tab-home:hover { color: var(--text); border-bottom-color: var(--text-mute); }
        /* ─────────── Dropdown Selector ─────────── */
        #md-selector {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-mute);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 0.35rem 0.6rem;
            cursor: pointer;
            outline: none;
            max-width: 240px;
            transition: color 300ms ease, border-color 300ms ease;
        }
        #md-selector:hover { color: var(--text); border-color: var(--text-mute); }
        #md-selector option { background: var(--bg-elev); color: var(--text); }
        /* ─────────── Header ─────────── */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(13,19,16,0.78);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border-bottom: 1px solid var(--line);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--text-mute);
        }
        .brand-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }
        .brand-name { color: var(--text); }
        .brand-file {
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0.02em;
            font-size: 12px;
        }
        .back-btn {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            padding: 0.8rem 1.4rem 0.8rem 1.2rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            transition: border-color 400ms var(--ease-quiet), color 400ms var(--ease-quiet), transform 400ms var(--ease-quiet);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            white-space: nowrap;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }
        .back-btn-arrow {
            display: inline-block;
            transition: transform 400ms var(--ease-quiet);
            font-size: 14px;
            line-height: 1;
        }
        .back-btn:hover .back-btn-arrow { transform: translateX(-4px); }
        /* ─────────── Main / Article ─────────── */
        main {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 5rem 2rem 8rem;
        }
        article#content { font-feature-settings: "kern" 1, "liga" 1; }
        /* ─────────── Typography ─────────── */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: var(--text);
            margin-top: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: clamp(2.4rem, 5.5vw, 3.4rem);
            letter-spacing: -0.035em;
            line-height: 1.05;
            margin-top: 0;
            margin-bottom: 2rem;
        }
        h2 {
            font-size: clamp(1.6rem, 3vw, 2rem);
            margin-top: 4rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--line);
        }
        h3 { font-size: 1.4rem; margin-top: 2.5rem; }
        h4 { font-size: 1.15rem; margin-top: 2rem; color: var(--text); }
        h5 {
            font-size: 1rem;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        h6 {
            font-size: 0.9rem;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }
        p { margin-bottom: 1.5rem; color: var(--text); }
        a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-dim);
            transition: border-color 300ms ease, color 300ms ease;
        }
        a:hover { border-color: var(--accent); color: var(--accent); }
        strong, b { font-weight: 600; color: var(--text); }
        em, i { font-style: italic; }
        del, s { color: var(--text-faint); }
        mark {
            background: rgba(201,169,97,0.18);
            color: var(--text);
            padding: 0.1em 0.3em;
            border-radius: 2px;
        }
        /* ─────────── Inline code ─────────── */
        code {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.86em;
            background: var(--bg-code);
            padding: 0.15em 0.4em;
            border-radius: 3px;
            border: 1px solid var(--line);
            color: var(--accent);
            font-weight: 400;
        }
        /* ─────────── Code blocks ─────────── */
        pre {
            background: var(--bg-code) !important;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1.5rem 1.75rem;
            overflow-x: auto;
            margin: 2rem 0;
            font-size: 0.86rem;
            line-height: 1.65;
            position: relative;
        }
        pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text);
            font-size: inherit;
            font-weight: 400;
        }
        /* Custom Prism token palette tuned to forest-dark */
        .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--text-faint); font-style: italic; }
        .token.punctuation { color: var(--text-mute); }
        .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: #c9a961; }
        .token.boolean, .token.number { color: #b8c9a0; }
        .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #d4c5a0; }
        .token.operator, .token.entity, .token.url, .token.variable { color: var(--text-mute); }
        .token.atrule, .token.attr-value, .token.function, .token.class-name { color: #a0b890; }
        .token.keyword { color: #c9a961; font-weight: 500; }
        .token.regex, .token.important { color: #d4956b; }
        /* ─────────── Blockquote ─────────── */
        blockquote {
            margin: 2rem 0;
            padding: 1.25rem 1.75rem;
            border-left: 2px solid var(--accent);
            background: rgba(201,169,97,0.035);
            color: var(--text-mute);
            font-style: italic;
            border-radius: 0 4px 4px 0;
        }
        blockquote p { margin-bottom: 0.75rem; color: var(--text-mute); }
        blockquote p:last-child { margin-bottom: 0; }
        blockquote strong { color: var(--text); }
        /* ─────────── Lists ─────────── */
        ul, ol { margin: 1.5rem 0; padding-left: 1.5rem; }
        li { margin-bottom: 0.5rem; padding-left: 0.25rem; }
        li::marker { color: var(--accent); }
        ol li::marker {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9em;
            color: var(--accent);
        }
        /* Nested lists */
        ul ul, ol ol, ul ol, ol ul { margin: 0.5rem 0 0; }
        /* Task lists */
        .task-list-item, li.task-list-item { list-style: none; margin-left: -1.5rem; }
        .task-list-item input[type="checkbox"] {
            margin-right: 0.6rem;
            accent-color: var(--accent);
            transform: translateY(2px);
        }
        /* ─────────── Tables ─────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.94rem;
            display: block;
            overflow-x: auto;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        td { white-space: normal; }
        th {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-mute);
            border-bottom: 2px solid var(--accent-dim);
        }
        tbody tr { transition: background 300ms ease; }
        tbody tr:hover { background: rgba(201,169,97,0.03); }
        /* ─────────── Horizontal rule ─────────── */
        hr {
            border: none;
            height: 1px;
            background: var(--line);
            margin: 4rem 0;
            position: relative;
        }
        hr::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg);
            padding: 0 1rem;
            color: var(--accent);
            font-size: 0.7rem;
        }
        /* ─────────── Images ─────────── */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--line);
            margin: 2rem 0;
            display: block;
        }
        img + em {
            display: block;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-faint);
            margin-top: -1.25rem;
            margin-bottom: 2rem;
            font-style: italic;
        }
        /* ─────────── Definition lists ─────────── */
        dt {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            margin-top: 1.25rem;
            color: var(--text);
        }
        dd { margin-left: 1.5rem; margin-top: 0.25rem; color: var(--text-mute); }
        /* ─────────── Footnotes (if extension present) ─────────── */
        .footnote, sup {
            font-size: 0.75em;
            vertical-align: super;
            color: var(--accent);
        }
        /* ─────────── Entrance animation ─────────── */
        #content > * {
            opacity: 0;
            transform: translateY(20px);
            animation: rise 900ms var(--ease-quiet) forwards;
        }
        @keyframes rise { to { opacity: 1; transform: translateY(0); } }
        #content > *:nth-child(1) { animation-delay: 80ms; }
        #content > *:nth-child(2) { animation-delay: 160ms; }
        #content > *:nth-child(3) { animation-delay: 240ms; }
        #content > *:nth-child(4) { animation-delay: 320ms; }
        #content > *:nth-child(5) { animation-delay: 400ms; }
        #content > *:nth-child(6) { animation-delay: 480ms; }
        #content > *:nth-child(n+7) { animation-delay: 560ms; }
        @media (prefers-reduced-motion: reduce) {
            #content > * { opacity: 1; transform: none; animation: none; }
            html { scroll-behavior: auto; }
        }
        /* ─────────── Scrollbar ─────────── */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
        /* ─────────── Error state ─────────── */
        .error-panel {
            padding: 2.5rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg-elev);
            margin-top: 2rem;
        }
        .error-panel h1 { margin-top: 0; }
        .error-panel code { font-size: 0.85em; }
        /* ─────────── Footer ─────────── */
        footer {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
            color: var(--text-faint);
            font-size: 0.82rem;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.04em;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--line-soft);
            padding-top: 2rem;
            margin-top: 4rem;
        }
        /* ─────────── Mobile ─────────── */
        @media (max-width: 720px) {
            header { padding: 1rem 1.25rem; }
            .brand-file { display: none; }
            main { padding: 3rem 1.25rem 5rem; }
            body { font-size: 16px; }
            h1 { font-size: 2rem; }
            h2 { font-size: 1.5rem; }
            pre { padding: 1.25rem; font-size: 0.8rem; }
            footer { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <nav id="md-tabs" style="position:sticky;top:0;z-index:50;">
        <span class="brand-file" id="filename" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);">text.md</span>
        <a href="index.html" class="md-tab-home" aria-label="Home">Home</a>
        <select id="md-selector">
            <option value="" disabled selected>Scanning…</option>
        </select>
    </nav>
    <main>
        <article id="content">
            <p style="color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem;">Loading…</p>
        </article>
    </main>
    <footer>
        <span id="footer-meta">text.md · rendered locally</span>
        <span id="footer-time"></span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script>
        // Configure marked for full GFM
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: true,
            mangle: false,
            langPrefix: 'language-'
        });

        const article = document.getElementById('content');
        const fileLabel = document.getElementById('filename');
        const mdSelector = document.getElementById('md-selector');
        let currentFile = null;

        function renderFile(filename) {
            if (!filename) return;
            currentFile = filename;
            fileLabel.textContent = filename;
            document.getElementById('footer-meta').textContent = filename + ' · rendered locally';
            mdSelector.value = filename;

            fetch(filename)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' — file not found or not accessible');
                    return r.text();
                })
                .then(md => {
                    article.innerHTML = marked.parse(md);
                    if (window.Prism) Prism.highlightAllUnder(article);
                    document.getElementById('footer-time').textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                })
                .catch(err => {
                    article.innerHTML = `
                        <div class="error-panel">
                            <h1>Couldn't load ${filename}</h1>
                            <p style="color: var(--text-mute); margin-bottom: 1.5rem;">${err.message}.</p>
                        </div>
                    `;
                    if (window.Prism) Prism.highlightAllUnder(article);
                    document.getElementById('footer-meta').textContent = filename + ' · failed to load';
                });
        }

        // Scan current directory for .md files via PHP utility
        async function scanDirectory() {
            try {
                const res = await fetch('scan_files.php');
                const files = await res.json();

                mdSelector.innerHTML = '<option value="" disabled>Select a file…</option>';

                files.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file;
                    opt.textContent = file;
                    mdSelector.appendChild(opt);
                });

                const defaultFile = files.find(f => f === 'text.md') || files[0];
                if (defaultFile) {
                    renderFile(defaultFile);
                } else {
                    document.getElementById('content').innerHTML = `
                        <div class="error-panel">
                            <h1>No markdown files found</h1>
                            <p style="color: var(--text-mute);">Could not locate any <code>.md</code> files in the current directory.</p>
                        </div>
                    `;
                }
            } catch (err) {
                mdSelector.innerHTML = '<option value="text.md">text.md</option>';
                renderFile('text.md');
            }
        }

        mdSelector.addEventListener('change', () => {
            renderFile(mdSelector.value);
        });

        // Initial scan and render
        scanDirectory();
    </script>
</body>
</html>
