<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6" />
            <stop offset="100%" style="stop-color:#8b5cf6" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background Circle -->
    <circle cx="50" cy="50" r="45" fill="rgba(59, 130, 246, 0.05)" stroke="url(#iconGradient)" stroke-width="2" />
    
    <!-- Central Hub -->
    <circle cx="50" cy="40" r="12" fill="url(#iconGradient)" filter="url(#glow)" />
    
    <!-- Connection Lines -->
    <path d="M50 52V75M35 65L50 52L65 65" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Nodes -->
    <circle cx="35" cy="65" r="5" fill="url(#iconGradient)" />
    <circle cx="65" cy="65" r="5" fill="url(#iconGradient)" />
    <circle cx="50" cy="75" r="5" fill="url(#iconGradient)" />
</svg>
