<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6" />
            <stop offset="100%" style="stop-color:#8b5cf6" />
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect x="8" y="8" width="84" height="84" rx="12" fill="rgba(59, 130, 246, 0.08)" stroke="url(#iconGradient)" stroke-width="2" />
    
    <!-- Header bar -->
    <rect x="16" y="16" width="68" height="10" rx="3" fill="url(#iconGradient)" opacity="0.3" />
    
    <!-- Service Row 1 -->
    <circle cx="28" cy="40" r="6" fill="#22c55e" />
    <rect x="40" y="36" width="36" height="8" rx="2" fill="url(#iconGradient)" opacity="0.4" />
    
    <!-- Service Row 2 -->
    <circle cx="28" cy="58" r="6" fill="#22c55e" />
    <rect x="40" y="54" width="28" height="8" rx="2" fill="url(#iconGradient)" opacity="0.4" />
    
    <!-- Service Row 3 (offline) -->
    <circle cx="28" cy="76" r="6" fill="#ef4444" />
    <rect x="40" y="72" width="32" height="8" rx="2" fill="url(#iconGradient)" opacity="0.2" />
</svg>